name: Sync Encrypted Secrets

# Decrypt AES-256-GCM vault blobs, validate with Zod, inject into Railway
# staging/production — never echoes raw secret values in logs.
#
# Required GitHub secrets:
#   SECRETS_MASTER_KEY     # 32-byte hex (64 chars) or base64
#   RAILWAY_TOKEN          # Railway project token
# Optional:
#   RAILWAY_SERVICE_ID
#   RAILWAY_ENVIRONMENT_ID / RAILWAY_PROJECT_ID  # GraphQL fallback
#   DATABASE_URL           # persist SECRET_SYNCED / SECRET_ROTATION_DUE audits
#   SECRETS_ALERT_WEBHOOK  # Slack/Discord on stale keys

on:
  push:
    branches: [main, master]
    paths:
      - "secrets/vault/**"
      - "secrets/rotation-manifest.json"
      - "scripts/secrets/**"
      - "src/lib/env.ts"
      - ".github/workflows/sync-secrets.yml"
  schedule:
    # Weekly rotation audit (Monday 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Railway environment to sync"
        type: choice
        options: [staging, production, both]
        default: staging
      dry_run:
        description: "Validate + plan without writing Railway variables"
        type: boolean
        default: false
      skip_sync:
        description: "Only run rotation audit (no Railway upsert)"
        type: boolean
        default: false

concurrency:
  group: sync-secrets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rotate-audit:
    name: Secret rotation audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Lean install — secrets CLIs only need tsx + zod (avoids lockfile drift).
      - name: Install secrets tooling
        run: npm install --no-save --no-package-lock --legacy-peer-deps tsx zod

      - name: Run rotation audit
        id: audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--fail-on-stale)
          if [ -n "${SECRETS_MASTER_KEY:-}" ]; then
            ARGS+=(--env production)
          fi
          npx tsx scripts/secrets/rotate-audit.ts "${ARGS[@]}" | tee rotation-audit.log

      - name: Alert on stale secrets
        if: failure() && steps.audit.outcome == 'failure'
        env:
          SECRETS_ALERT_WEBHOOK: ${{ secrets.SECRETS_ALERT_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          HOOK="${SECRETS_ALERT_WEBHOOK:-${DISCORD_WEBHOOK_URL:-${SLACK_WEBHOOK_URL:-}}}"
          if [ -z "${HOOK}" ]; then
            echo "No alert webhook configured — see job logs for stale keys"
            exit 0
          fi
          # Never include decrypted values — log file is key names / ages only.
          BODY=$(jq -n \
            --arg text "Secret rotation audit failed on ${GITHUB_REPOSITORY}@${GITHUB_SHA}. Check Actions logs (key names + ages only)." \
            '{content:$text, text:$text}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "${BODY}" "${HOOK}" \
            || echo "Webhook post failed (non-fatal)"

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-audit-log
          path: rotation-audit.log
          if-no-files-found: ignore
          retention-days: 30

  resolve-targets:
    name: Resolve sync targets
    needs: rotate-audit
    if: >
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_sync == true)
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.pick.outputs.envs }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          # Default to production — Railway currently has no staging environment.
          TARGET="${{ github.event_name == 'workflow_dispatch' && inputs.target || 'production' }}"
          case "${TARGET}" in
            staging) echo 'envs=["staging"]' >> "$GITHUB_OUTPUT" ;;
            both) echo 'envs=["staging","production"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'envs=["production"]' >> "$GITHUB_OUTPUT" ;;
          esac

  sync:
    name: Decrypt + inject (${{ matrix.env }})
    needs: resolve-targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.resolve-targets.outputs.envs) }}
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install secrets tooling
        run: npm install --no-save --no-package-lock --legacy-peer-deps tsx zod

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Ensure vault blob exists
        run: |
          set -euo pipefail
          VAULT="secrets/vault/${{ matrix.env }}.enc"
          if [ ! -f "${VAULT}" ]; then
            echo "::warning::Vault ${VAULT} not present — skip sync for ${{ matrix.env }}"
            echo "SKIP_SYNC=1" >> "$GITHUB_ENV"
          else
            echo "SKIP_SYNC=0" >> "$GITHUB_ENV"
          fi

      - name: Validate encrypted vault (Zod)
        if: env.SKIP_SYNC == '0'
        env:
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SECRETS_MASTER_KEY:-}" ]; then
            echo "::error::SECRETS_MASTER_KEY GitHub secret is required"
            exit 1
          fi
          # Lists key names + validation issues only — never prints values.
          npx tsx scripts/secrets/manager.ts validate --env ${{ matrix.env }}

      - name: Sync variables to Railway
        if: env.SKIP_SYNC == '0'
        env:
          SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT: ${{ matrix.env }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
        run: |
          set -euo pipefail
          # Disable shell xtrace so KEY=value never lands in logs.
          set +x
          ARGS=(--env ${{ matrix.env }})
          if [ "${DRY_RUN}" = "1" ]; then
            ARGS+=(--dry-run)
          fi
          npx tsx scripts/secrets/sync-railway.ts "${ARGS[@]}"

      - name: Record sync summary
        if: always()
        run: |
          {
            echo "### Secrets sync — \`${{ matrix.env }}\`"
            echo ""
            echo "- Vault present: \`${{ env.SKIP_SYNC == '0' && 'yes' || 'no' }}\`"
            echo "- Dry run: \`${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}\`"
            echo "- Values redacted in all steps (key names only)."
          } >> "$GITHUB_STEP_SUMMARY"
